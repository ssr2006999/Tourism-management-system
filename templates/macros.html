{% macro package_form(package=None) %}
<form method="POST" action="{{ url_for('admin.admin_dashboard') }}" style="margin-bottom: 30px;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-section" style="max-width: none; margin: 0;">
        <h3>{{ 'Edit Package' if package else 'Add Package' }}</h3>
        {% if package %}
        <input type="hidden" name="pkg_id" value="{{ package.id }}">
        <input type="hidden" name="action" value="edit_package">
        {% else %}
        <input type="hidden" name="action" value="add_package">
        {% endif %}
        <div class="form-group">
            <input type="text" name="pkg_name" value="{{ package.package_name if package else '' }}" required placeholder="Package name">
        </div>
        <div class="form-group">
            <input type="text" name="dest_name" value="{{ package.destination_name if package else '' }}" required placeholder="Destination name">
        </div>
        <div class="form-group">
            <input type="text" name="dest_location" value="{{ package.location if package else '' }}" required placeholder="Location">
        </div>
        <div class="form-group">
            <input type="number" name="days" value="{{ package.days if package else '' }}" required placeholder="Number of days">
        </div>
        <div class="form-group">
            <input type="number" step="0.01" name="price" value="{{ package.price if package else '' }}" required placeholder="Price">
        </div>
        <div class="form-group">
            <textarea name="description" placeholder="Description">{{ package.description if package else '' }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">{{ 'Save Changes' if package else 'Add Package' }}</button>
        {% if package %}
        <a href="{{ url_for('admin.admin_dashboard') }}" class="btn btn-secondary" style="margin-left: 10px;">Cancel</a>
        {% endif %}
    </div>
</form>
{% endmacro %}
